<!doctype html>
<html>
    <head>
    <meta charset="utf-8">
    <title>Dibujo de Figuras</title>
    <link rel="stylesheet" href="style.css">

    <!-- Fuente de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">

    <style>
      h1 {
        text-align: center;
        font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
        font-weight: 600;
        font-size: 48px;
        letter-spacing: 2px;
        color: #452b1a;
        margin: 20px 0;
      }
    </style>
  </head>

  <body>

    <h1>Dibujo de Figuras</h1>

    <canvas id="canvas" width="1100" height="900"></canvas>

    <script>
    window.onload = function () {

      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d');

      var gradiente;


            /* --------------------------------
         CASTILLO (tamaño final)
         Ocupa x: 30 a 414 | y: 126 a 480
      -------------------------------- */

      context.save();


      /* ---------- TORRE IZQUIERDA ---------- */

      // Rectángulo con degradado horizontal (amarillo a naranja)
      gradiente = context.createLinearGradient(30, 0, 156, 0);
      gradiente.addColorStop(0, 'gold');
      gradiente.addColorStop(1, 'darkorange');
      context.fillStyle = gradiente;
      context.fillRect(30, 312, 126, 168);

      // Techo triangular con degradado vertical (verde claro a verde oscuro)
      gradiente = context.createLinearGradient(0, 222, 0, 312);
      gradiente.addColorStop(0, 'limegreen');
      gradiente.addColorStop(1, 'darkgreen');
      context.fillStyle = gradiente;
      context.beginPath();
      context.moveTo(30, 312);
      context.lineTo(93, 222);
      context.lineTo(156, 312);
      context.closePath();
      context.fill();

      // Ventana en forma de rombo
      context.fillStyle = 'skyblue';
      context.beginPath();
      context.moveTo(93, 348);
      context.lineTo(126, 381);
      context.lineTo(93, 414);
      context.lineTo(60, 381);
      context.closePath();
      context.fill();


      /* ---------- BANDERA IZQUIERDA ---------- */

      context.fillStyle = 'red';
      context.beginPath();
      context.moveTo(93, 222);
      context.lineTo(93, 168);
      context.lineTo(138, 195);
      context.lineTo(93, 222);
      context.closePath();
      context.fill();


      /* ---------- TORRE CENTRAL ---------- */

      // Rectángulo con degradado vertical (naranja a rojo oscuro)
      gradiente = context.createLinearGradient(0, 222, 0, 480);
      gradiente.addColorStop(0, 'orangered');
      gradiente.addColorStop(1, '#8b1a00');
      context.fillStyle = gradiente;
      context.fillRect(156, 222, 126, 258);

      // Techo triangular con degradado vertical (morado a índigo)
      gradiente = context.createLinearGradient(0, 126, 0, 222);
      gradiente.addColorStop(0, 'mediumorchid');
      gradiente.addColorStop(1, 'indigo');
      context.fillStyle = gradiente;
      context.beginPath();
      context.moveTo(156, 222);
      context.lineTo(219, 126);
      context.lineTo(282, 222);
      context.closePath();
      context.fill();

      // Ventana rombo
      context.fillStyle = 'skyblue';
      context.beginPath();
      context.moveTo(219, 282);
      context.lineTo(255, 318);
      context.lineTo(219, 354);
      context.lineTo(183, 318);
      context.closePath();
      context.fill();

      // Puerta
      context.fillStyle = 'darkred';
      context.fillRect(186, 378, 66, 102);


      /* ---------- TORRE DERECHA ---------- */

      // Rectángulo con degradado horizontal (naranja a amarillo)
      gradiente = context.createLinearGradient(282, 0, 414, 0);
      gradiente.addColorStop(0, 'darkorange');
      gradiente.addColorStop(1, 'gold');
      context.fillStyle = gradiente;
      context.fillRect(282, 282, 132, 198);

      // Techo triangular con degradado vertical (verde claro a verde oscuro)
      gradiente = context.createLinearGradient(0, 198, 0, 282);
      gradiente.addColorStop(0, 'limegreen');
      gradiente.addColorStop(1, 'darkgreen');
      context.fillStyle = gradiente;
      context.beginPath();
      context.moveTo(282, 282);
      context.lineTo(348, 198);
      context.lineTo(414, 282);
      context.closePath();
      context.fill();

      // Ventana circular
      context.fillStyle = 'skyblue';
      context.beginPath();
      context.arc(348, 339, 30, 0, Math.PI * 2);
      context.fill();

      // Rombo morado
      context.fillStyle = 'mediumorchid';
      context.beginPath();
      context.moveTo(348, 390);
      context.lineTo(375, 417);
      context.lineTo(348, 444);
      context.lineTo(321, 417);
      context.closePath();
      context.fill();


      /* ---------- BANDERA DERECHA ---------- */

      context.fillStyle = 'red';
      context.beginPath();
      context.moveTo(348, 210);
      context.lineTo(348, 150);
      context.lineTo(393, 174);
      context.lineTo(348, 198);
      context.closePath();
      context.fill();


      context.restore();


      /* --------------------------------
         ZORRO SIMPLIFICADO
      -------------------------------- */

      context.save();
      context.translate(740, 40);     // posición en el canvas
      context.scale(0.35, 0.35);      // tamaño

      // Forma exterior negra
      context.fillStyle = '#222';
      context.beginPath();
      context.moveTo(180, 45);     // oreja izquierda
      context.lineTo(298, 100);
      context.lineTo(380, 218);    // frente
      context.lineTo(520, 218);
      context.lineTo(602, 100);
      context.lineTo(720, 45);     // oreja derecha
      context.lineTo(708, 270);
      context.lineTo(665, 335);
      context.lineTo(748, 405);    // mejilla derecha
      context.lineTo(450, 668);    // punta inferior
      context.lineTo(152, 408);    // mejilla izquierda
      context.lineTo(215, 335);
      context.lineTo(192, 285);
      context.closePath();
      context.fill();

      // Parte amarilla
      context.fillStyle = 'gold';
      context.beginPath();
      context.moveTo(210, 90);     // oreja izquierda
      context.lineTo(280, 122);
      context.lineTo(368, 245);    // frente
      context.lineTo(532, 245);
      context.lineTo(620, 122);
      context.lineTo(690, 90);     // oreja derecha
      context.lineTo(672, 300);
      context.lineTo(705, 398);    // mejilla derecha
      context.lineTo(610, 425);
      context.lineTo(485, 600);    // hocico
      context.lineTo(415, 600);
      context.lineTo(290, 420);
      context.lineTo(195, 398);    // mejilla izquierda
      context.lineTo(232, 310);
      context.lineTo(212, 270);
      context.closePath();
      context.fill();

      // Interior oreja izquierda
      context.fillStyle = '#222';
      context.beginPath();
      context.moveTo(230, 127);
      context.lineTo(320, 262);
      context.lineTo(268, 315);
      context.lineTo(230, 270);
      context.closePath();
      context.fill();

      // Interior oreja derecha
      context.beginPath();
      context.moveTo(668, 127);
      context.lineTo(580, 262);
      context.lineTo(632, 315);
      context.lineTo(668, 270);
      context.closePath();
      context.fill();

      // Ojo izquierdo (triángulo)
      context.beginPath();
      context.moveTo(298, 357);
      context.lineTo(392, 410);
      context.lineTo(415, 498);
      context.closePath();
      context.fill();

      // Ojo derecho (triángulo)
      context.beginPath();
      context.moveTo(602, 357);
      context.lineTo(508, 410);
      context.lineTo(485, 498);
      context.closePath();
      context.fill();

      // Nariz
      context.beginPath();
      context.moveTo(420, 592);
      context.lineTo(480, 592);
      context.lineTo(450, 620);
      context.closePath();
      context.fill();

      // Mancha blanca izquierda
      context.fillStyle = 'white';
      context.beginPath();
      context.moveTo(222, 430);
      context.lineTo(290, 445);
      context.lineTo(335, 528);
      context.closePath();
      context.fill();

      // Mancha blanca derecha
      context.beginPath();
      context.moveTo(678, 430);
      context.lineTo(610, 445);
      context.lineTo(565, 528);
      context.closePath();
      context.fill();

      context.restore();

               /* --------------------------------
         HONGO VERDE (tamaño final)
         Ocupa x: 700 a 1048 | y: 300 a 747
      -------------------------------- */

      context.save();


      /* ---------- TALLO (parte exterior color arena) ---------- */

      context.fillStyle = '#f2cf96';
      context.beginPath();
      context.moveTo(827, 528);
      context.lineTo(902, 523);
      context.lineTo(909, 554);
      context.lineTo(914, 618);
      context.lineTo(920, 706);
      context.lineTo(902, 747);
      context.lineTo(868, 747);
      context.lineTo(815, 700);
      context.lineTo(832, 614);
      context.lineTo(831, 570);
      context.closePath();
      context.fill();


      /* ---------- TALLO (parte interior rosa claro) ---------- */

      context.fillStyle = '#f9e6de';
      context.beginPath();
      context.moveTo(833, 568);
      context.lineTo(880, 573);
      context.lineTo(889, 598);
      context.lineTo(897, 690);
      context.lineTo(867, 746);
      context.lineTo(816, 700);
      context.lineTo(832, 614);
      context.closePath();
      context.fill();


      /* ---------- SOMBRERO (parte clara) ---------- */

      // Degradado diagonal (amarillo claro arriba a la izquierda, verde lima abajo a la derecha)
      gradiente = context.createLinearGradient(700, 300, 1000, 530);
      gradiente.addColorStop(0, '#eef48a');
      gradiente.addColorStop(0.5, '#dce05a');
      gradiente.addColorStop(1, '#bcc43c');
      context.fillStyle = gradiente;

      context.beginPath();
      context.moveTo(826, 305);
      context.lineTo(906, 300);
      context.lineTo(916, 306);
      context.lineTo(1038, 372);
      context.lineTo(1048, 461);
      context.lineTo(1009, 511);
      context.lineTo(814, 530);
      context.lineTo(718, 516);
      context.lineTo(701, 482);
      context.lineTo(707, 416);
      context.lineTo(752, 361);
      context.closePath();
      context.fill();


            /* ---------- SOMBRERO (una sola pieza) ---------- */

      // Degradado diagonal: amarillo claro arriba a la izquierda, verde oliva abajo a la derecha
      gradiente = context.createLinearGradient(700, 300, 1048, 530);
      gradiente.addColorStop(0, '#eef48a');
      gradiente.addColorStop(0.45, '#dce05a');
      gradiente.addColorStop(0.75, '#b3bb40');
      gradiente.addColorStop(1, '#8a9627');
      context.fillStyle = gradiente;

      context.beginPath();
      context.moveTo(826, 305);
      context.lineTo(906, 300);
      context.lineTo(916, 306);
      context.lineTo(1038, 372);
      context.lineTo(1048, 461);
      context.lineTo(1009, 511);
      context.lineTo(814, 530);
      context.lineTo(718, 516);
      context.lineTo(701, 482);
      context.lineTo(707, 416);
      context.lineTo(752, 361);
      context.closePath();
      context.fill();

      context.restore();

      /* --------------------------------
         ESTRELLA (tamaño final)
         Ocupa x: 100 a 350 | y: 560 a 800
      -------------------------------- */

      context.save();

      // Degradado diagonal (rosa claro arriba a la izquierda, rosa fuerte abajo a la derecha)
      gradiente = context.createLinearGradient(100, 560, 350, 800);
      gradiente.addColorStop(0, '#ffc4de');
      gradiente.addColorStop(0.5, '#ff8fbf');
      gradiente.addColorStop(1, '#e0307f');
      context.fillStyle = gradiente;

      context.beginPath();
      context.moveTo(225, 560);    // punta superior
      context.lineTo(250, 637);
      context.lineTo(350, 639);    // punta derecha
      context.lineTo(270, 695);
      context.lineTo(300, 800);    // punta inferior derecha
      context.lineTo(225, 735);
      context.lineTo(150, 800);    // punta inferior izquierda
      context.lineTo(180, 695);
      context.lineTo(100, 639);    // punta izquierda
      context.lineTo(200, 637);
      context.closePath();
      context.fill();

      context.restore();

            /* --------------------------------
         LUNA (tamaño final)
         Ocupa x: 400 a 640 | y: 570 a 797
      -------------------------------- */

      context.save();


      /* ---------- CUERPO DE LA LUNA ---------- */

      // Degradado diagonal (claro arriba a la izquierda, gris azulado abajo a la derecha)
      gradiente = context.createLinearGradient(400, 570, 640, 797);
      gradiente.addColorStop(0, '#f4f7fd');
      gradiente.addColorStop(0.55, '#d5ddec');
      gradiente.addColorStop(1, '#8fa0bd');
      context.fillStyle = gradiente;

      context.beginPath();
      context.moveTo(476, 570);    // parte superior
      context.lineTo(552, 572);
      context.lineTo(621, 606);
      context.lineTo(640, 673);    // lado derecho
      context.lineTo(625, 736);
      context.lineTo(588, 775);
      context.lineTo(563, 794);
      context.lineTo(500, 797);    // parte inferior
      context.lineTo(425, 763);
      context.lineTo(400, 705);    // lado izquierdo
      context.lineTo(403, 671);
      context.lineTo(410, 621);
      context.lineTo(438, 593);
      context.closePath();
      context.fill();


      /* ---------- CRATERES (octágonos) ---------- */

      var i, angulo, cx, cy, r;
      var crateres = [
        { x: 549, y: 622, r: 17 },   // cráter grande (arriba a la derecha)
        { x: 557, y: 707, r: 11 },   // cráter mediano (abajo a la derecha)
        { x: 445, y: 693, r: 6 }     // cráter pequeño (a la izquierda)
      ];

      for (i = 0; i < crateres.length; i++) {
        cx = crateres[i].x;
        cy = crateres[i].y;
        r  = crateres[i].r;

        // Degradado propio de cada cráter (más oscuro arriba, más claro abajo)
        gradiente = context.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        gradiente.addColorStop(0, '#7f93b2');
        gradiente.addColorStop(1, '#c9d5e6');
        context.fillStyle = gradiente;

        context.beginPath();
        for (angulo = 0; angulo < 8; angulo++) {
          var a = (Math.PI / 4) * angulo + Math.PI / 8;
          var px = cx + r * Math.cos(a);
          var py = cy + r * Math.sin(a);
          if (angulo === 0) {
            context.moveTo(px, py);
          } else {
            context.lineTo(px, py);
          }
        }
        context.closePath();
        context.fill();
      }

      context.restore();

      /* --------------------------------
         ANIMAL GEOMETRICO (tamaño final)
         Ocupa x: 450 a 680 | y: 200 a 437
      -------------------------------- */

      context.save();


      /* ---------- CUERPO (triángulo azul claro) ---------- */

      context.fillStyle = '#cfe4f3';
      context.beginPath();
      context.moveTo(475, 299);
      context.lineTo(575, 299);
      context.lineTo(475, 395);
      context.closePath();
      context.fill();


      /* ---------- TRIÁNGULO CORAL (centro) ---------- */

      context.fillStyle = '#ee8a78';
      context.beginPath();
      context.moveTo(504, 369);
      context.lineTo(575, 300);
      context.lineTo(575, 369);
      context.closePath();
      context.fill();


      /* ---------- PATA / COLA (triángulo azul grande) ---------- */

      context.fillStyle = '#b5d3ec';
      context.beginPath();
      context.moveTo(575, 300);
      context.lineTo(641, 369);
      context.lineTo(575, 437);
      context.closePath();
      context.fill();


      /* ---------- COLA (paralelogramo rosa) ---------- */

      context.fillStyle = '#e8b0a5';
      context.beginPath();
      context.moveTo(645, 299);
      context.lineTo(680, 267);
      context.lineTo(680, 335);
      context.lineTo(645, 368);
      context.closePath();
      context.fill();


      /* ---------- CABEZA ---------- */

      // Oreja (triángulo naranja)
      context.fillStyle = '#e8894a';
      context.beginPath();
      context.moveTo(450, 249);
      context.lineTo(499, 200);
      context.lineTo(499, 249);
      context.closePath();
      context.fill();

      // Cuadrado azul marino
      context.fillStyle = '#1f2a52';
      context.fillRect(450, 249, 49, 50);

      // Hocico (triángulo amarillo)
      context.fillStyle = '#e6b050';
      context.beginPath();
      context.moveTo(499, 249);
      context.lineTo(548, 249);
      context.lineTo(499, 299);
      context.closePath();
      context.fill();

      context.restore();

    };
    </script>

  </body>
</html>
