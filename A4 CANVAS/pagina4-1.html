<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pagina 4</title>
  <style>
      canvas{
          border: 3px solid royalblue;
          background-color: skyblue;
      }
  </style>
<script>
    //window.onload=function(){}
    var y= -100; 
    var dy=1;
    function animate(){
        requestAnimationFrame(animate);
      //console.log('animando');
      var canvas = document.getElementById("micanvas");
      var context = canvas.getContext("2d");
      context.clearRect(0, 0, innerWidth, innerHeight);
      context.fillStyle=" brown"; 
      context.fillRect(300,y,100,100);

      context.fillStyle=" pink"; 
      context.fillRect(200,200,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(300,200,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(400,200,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(300,300,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(200,300,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(100,300,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(400,300,100,100);
      context.fillStyle=" pink"; 
      context.fillRect(500,300,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(300,400,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(400,400,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(400,400,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(200,400,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(300,500,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(200,500,100,100);
      context.fillStyle=" SaddleBrown"; 
      context.fillRect(400,500,100,100);

      if (y > 100 || y < -100)
      {
          dy= -dy;
      }
      y += dy;
      
    }
    animate();
</script>

  </head>
<body>
   <canvas id="micanvas" width="700" height="700"></canvas>
</body>
</html>
